[package]
name = "velocity"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.17.2"
rusqlite = { version = "0.38", features = ["bundled"] } # the same as Servo: one SQLite in the exe
serde_json = "1"
sha2 = "0.10" # checks downloaded updates (src/update.rs); already in Servo's tree
tao = "0.37.2"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry",
    # Encrypted media (src/drm.rs): PlayReady CDM, Media Engine, DirectComposition.
    "Foundation", "Foundation_Collections", "Media_Protection", "Win32_Media_MediaFoundation", "Win32_Media_Audio",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading",
    "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse",
], default-features = false }
windows-core = "0.62"
drm-wire = { path = "../velocity-engine/crates/drm-wire" }

# Velocity's engine (velocity-engine): every page (sites and Velocity's own) renders through Servo.
# Pinned exactly: servo is pre-1.0 and breaks between monthly releases.
servo = { version = "=0.8.0", features = ["no-wgl", "media-gstreamer"] }
# The (patched) network layer Servo uses, for its content blocker (ads and trackers).
servo-net = "=0.8.0"
# The callback type Servo's memory report answers through (test mode, bench/memory.ps1); in Servo's tree.
servo-base = "=0.8.0"
# The cookie type Servo's site data manager takes (imported logins go into the engine too).
cookie = "0.18"
# Same crate instance Stylo reads its prefs from; used to switch on `layout.css.masking.enabled`.
stylo_static_prefs = "=0.23.0"
euclid = "0.22"
url = "2.5"
# Response headers for the tab UI page the engine serves itself (same version as Servo's).
http = "1"
# Test mode screenshots (VELOCITY_SCREENSHOT); the same crate Servo decodes images with.
image = { version = "0.25", default-features = false, features = ["png"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3"

# The engine's patched Servo crates (each change marked "velocity patch", listed in
# ../velocity-engine/vendor/README.md).
[patch.crates-io]
servo-net = { path = "../velocity-engine/vendor/servo-net" }
servo-fonts = { path = "../velocity-engine/vendor/servo-fonts" }
servo-layout = { path = "../velocity-engine/vendor/servo-layout" }
servo-script = { path = "../velocity-engine/vendor/servo-script" }
ipc-channel = { path = "../velocity-engine/vendor/ipc-channel" }
servo-media-player = { path = "../velocity-engine/vendor/servo-media-player" }
servo-paint = { path = "../velocity-engine/vendor/servo-paint" }
servo-paint-api = { path = "../velocity-engine/vendor/servo-paint-api" }
servo-media-gstreamer = { path = "../velocity-engine/vendor/servo-media-gstreamer" }
servo-script-bindings = { path = "../velocity-engine/vendor/servo-script-bindings" }
servo-media = { path = "../velocity-engine/vendor/servo-media" }
servo-pixels = { path = "../velocity-engine/vendor/servo-pixels" }
servo-layout-api = { path = "../velocity-engine/vendor/servo-layout-api" }
stylo = { path = "../velocity-engine/vendor/stylo" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = true
