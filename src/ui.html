<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Theme tokens: change these to restyle the whole sidebar. --bg must match FRAME_RGB in main.rs. */
  :root {
    --bg: #1f1d23;
    --fg: #f4f1f8;
    --muted: rgba(244, 241, 248, .74);
    --glass: rgba(255, 255, 255, .07);
    --glass-hover: rgba(255, 255, 255, .11);
    --glass-active: rgba(255, 255, 255, .16);
    --line: rgba(255, 255, 255, .09);
    --accent: #c4b5fd;
    --radius: 10px;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12.5px var(--font); overflow: hidden; }
  body { display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 8px 8px; user-select: none; }
  button { all: unset; cursor: default; border-radius: 7px; }
  button:focus-visible, .tile:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Window bar: empty space drags the window, double-click maximizes. */
  #bar { display: flex; align-items: center; height: 32px; gap: 1px; }
  #bar .spacer { flex: 1; align-self: stretch; }
  #bar button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }
  #bar button:hover { background: var(--glass-hover); color: var(--fg); }
  #bar button.close:hover { background: #e5484d; color: #fff; }
  #grip { position: fixed; left: 0; top: 0; bottom: 0; width: 5px; cursor: ew-resize; }

  #urlform { position: relative; }
  #urlform svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--muted); width: 14px; height: 14px; }
  input { width: 100%; height: 34px; border: 1px solid transparent; border-radius: var(--radius); background: var(--glass); color: var(--fg); font: inherit; padding: 0 10px 0 30px; outline: none; }
  input::placeholder { color: var(--muted); }
  input:hover { background: var(--glass-hover); }
  input:focus { background: rgba(0, 0, 0, .25); border-color: var(--line); }

  #essentials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #essentials:empty { display: none; }
  .tile { height: 44px; border-radius: var(--radius); background: var(--glass); display: grid; place-items: center; }
  .tile:hover { background: var(--glass-hover); }
  .tile.active { background: var(--glass-active); box-shadow: inset 0 0 0 1px var(--line); }
  .tile img { width: 18px; height: 18px; }

  hr { border: 0; height: 1px; background: var(--line); margin: 2px 6px; }

  #new { height: 32px; padding: 0 10px; color: var(--muted); display: flex; align-items: center; gap: 9px; border-radius: var(--radius); }
  #new:hover { background: var(--glass); color: var(--fg); }
  #new svg { width: 14px; height: 14px; }

  #tabs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 5px 0 10px; border-radius: var(--radius); color: var(--muted); }
  .tab:hover { background: var(--glass); color: var(--fg); }
  .tab.active { background: var(--glass-active); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
  .tab img { width: 16px; height: 16px; flex: none; }
  .tab span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { width: 22px; height: 22px; display: grid; place-items: center; visibility: hidden; }
  .tab .x svg { width: 12px; height: 12px; }
  .tab:hover .x, .tab.active .x { visibility: visible; }
  .tab .x:hover { background: var(--glass-hover); }

  #foot { display: flex; align-items: center; }
  #foot button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }
  #foot button:hover { background: var(--glass-hover); color: var(--fg); }
</style>
</head>
<body>
  <div id="grip" onmousedown="send('resize')"></div>
  <div id="bar">
    <button title="Back (Alt+Left)" aria-label="Back" onclick="send('back')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button title="Forward (Alt+Right)" aria-label="Forward" onclick="send('forward')"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button title="Reload (F5)" aria-label="Reload" onclick="send('reload')"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <span class="spacer" id="drag"></span>
    <button title="Minimize" aria-label="Minimize" onclick="send('win:min')"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button title="Maximize" aria-label="Maximize" onclick="send('win:max')"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button class="close" title="Close" aria-label="Close" onclick="send('win:close')"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <form id="urlform" onsubmit="event.preventDefault(); go()">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="url" aria-label="Address" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
  </form>
  <div id="essentials" role="list" aria-label="Essentials"></div>
  <hr>
  <button id="new" title="New tab (Ctrl+T)" onclick="send('key:new')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Tab</button>
  <ul id="tabs" role="tablist" aria-label="Tabs"></ul>
  <div id="foot">
    <button title="DevTools (F12)" aria-label="DevTools" onclick="send('devtools')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const url = $('url'), list = $('tabs'), grid = $('essentials');
  const send = m => window.ipc.postMessage(m);
  const go = () => { send('go:' + url.value); url.blur(); };
  const host = u => { try { return new URL(u).host; } catch { return ''; } };
  // Fetch from the site itself so no third party learns which sites are open.
  // shortcut: misses icons declared via <link rel=icon> elsewhere; upgrade by reading WebView2's FaviconChanged event.
  const favicon = u => { try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.origin + '/favicon.ico' : ''; } catch { return ''; } };
  const icon = u => { const img = document.createElement('img'); img.alt = ''; img.src = favicon(u); img.onerror = () => img.style.visibility = 'hidden'; return img; };
  function focusUrl() { url.focus(); url.select(); }

  // Called from Rust with the whole state on every change.
  function render(tabs, active, essentials) {
    const cur = tabs.find(t => t.id === active);
    grid.replaceChildren(...essentials.map((e, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (cur && host(cur.url) === host(e) ? ' active' : '');
      tile.role = 'listitem';
      tile.tabIndex = 0;
      tile.title = host(e) + '\nRight-click to unpin';
      tile.onclick = () => send('essential:' + i);
      tile.onkeydown = ev => { if (ev.key === 'Enter') send('essential:' + i); };
      tile.oncontextmenu = ev => { ev.preventDefault(); send('unpin:' + e); };
      tile.append(icon(e));
      return tile;
    }));
    list.replaceChildren(...tabs.map(t => {
      const li = document.createElement('li');
      li.className = 'tab' + (t.id === active ? ' active' : '');
      li.role = 'tab';
      li.tabIndex = 0;
      li.ariaSelected = t.id === active;
      li.title = t.title + '\n' + t.url + '\nRight-click to pin to Essentials';
      const span = document.createElement('span');
      span.textContent = t.title || t.url;
      const x = document.createElement('button');
      x.className = 'x';
      x.ariaLabel = 'Close tab';
      x.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
      x.onclick = e => { e.stopPropagation(); send('close:' + t.id); };
      li.onclick = () => send('select:' + t.id);
      li.onkeydown = e => { if (e.key === 'Enter') send('select:' + t.id); };
      li.onauxclick = e => { if (e.button === 1) send('close:' + t.id); };
      li.oncontextmenu = e => { e.preventDefault(); send('pin:' + t.id); };
      li.append(icon(t.url), span, x);
      return li;
    }));
    if (cur && document.activeElement !== url) url.value = cur.url;
  }

  $('drag').addEventListener('mousedown', e => { if (e.button === 0 && e.detail === 1) send('drag'); });
  $('drag').addEventListener('dblclick', () => send('win:max'));
  url.addEventListener('focus', () => url.select());
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    const tabKey = e.ctrlKey && !e.altKey ? ({t: 'new', w: 'close', l: 'focus', Tab: e.shiftKey ? 'prev' : 'next'})[e.key] : null;
    if (tabKey) { e.preventDefault(); send('key:' + tabKey); return; }
    if (e.key === 'F5') { e.preventDefault(); send('reload'); }
    if (e.key === 'F12') { e.preventDefault(); send('devtools'); }
    if (e.altKey && e.key === 'ArrowLeft') send('back');
    if (e.altKey && e.key === 'ArrowRight') send('forward');
    if (e.key === 'Escape') url.blur();
  });
</script>
</body>
</html>
