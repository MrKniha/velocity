<!doctype html>
<html data-layout="side">
<head>
<meta charset="utf-8">
<style>
  /* Every colour comes from the user's settings via window.velocityTheme (THEME_JS in main.rs);
     these are only the Graphite defaults for the first paint. */
  :root {
    --frame: #18181b; --text: #ececee; --muted: #a1a1aa; --accent: #ececee;
    --hair: rgb(236 236 238 / .1); --hover: rgb(236 236 238 / .06); --active: rgb(236 236 238 / .11); --field: rgb(236 236 238 / .07);
    --font-size: 13px;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--frame); color: var(--text); font: var(--font-size)/1.3 var(--font); overflow: hidden; }
  ::selection { background: var(--active); }
  button { all: unset; cursor: default; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ib { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 6px; }
  .ib:hover { background: var(--hover); color: var(--text); }
  .ib.close:hover { background: #c42b1c; color: #fff; }

  /* Sidebar layout: the window controls live in a strip above the page that opens when the cursor reaches the
     top edge (Rust moves the page down by TOP_STRIP = 36px and lays this webview under the whole window). */
  #topstrip { display: none; position: fixed; z-index: 2; top: 0; height: 36px; left: var(--sw); right: 0; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 6px; }
  [data-side=right] #topstrip { left: 0; right: var(--sw); }
  [data-toppeek=true] #topstrip { display: flex; }
  [data-toppeek=true][data-layout=side] body { position: fixed; top: 0; bottom: 0; left: 0; width: var(--sw); }
  [data-toppeek=true][data-layout=side][data-side=right] body { left: auto; right: 0; }

  /* Downloads button: a progress ring while something downloads, a dot when one finished unseen. */
  #dl { position: relative; }
  #dl::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; display: none;
    background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), var(--hair) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); }
  #dl[data-busy=true]::before { display: block; }
  #dl[data-busy=true][data-known=false]::before { background: conic-gradient(var(--accent) 25%, var(--hair) 0); animation: spin 1s linear infinite; }
  #dl[data-busy=true] { color: var(--text); }
  #dl i { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
  #dl[data-unseen=true] i { display: block; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { #dl::before { animation: none !important; } }
  .row { display: flex; align-items: center; }
  #drag { min-width: 40px; align-self: stretch; }

  /* Window glass: the wallpaper, blurred and tinted with the frame colour, fills this webview. With the
     full-window layout the webview lies under the whole window (the page sits on top), so the UI itself is
     confined to its column or bar below. #wall is aligned to the window via velocityFrame(). */
  #wall { position: fixed; z-index: -1; overflow: hidden; display: none; }
  [data-wall=true] #wall { display: block; }
  [data-wall=true], [data-wall=true] body { background: transparent; }
  #wall > img, #wall > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(var(--wall-blur, 24px)); transform: scale(1.08); }
  #wall::after { content: ""; position: absolute; inset: 0; background: var(--frame); opacity: var(--wall-tint, .45); }
  [data-wall=true] .tile, [data-wall=true] #urlform { background: rgb(255 255 255 / .1); }
  [data-wall=true][data-dark=false] .tile, [data-wall=true][data-dark=false] #urlform { background: rgb(255 255 255 / .45); }
  [data-full=true][data-layout=side] body { position: fixed; top: 0; bottom: 0; left: 0; width: var(--sw); }
  [data-full=true][data-layout=side][data-side=right] body { left: auto; right: 0; }
  [data-full=true][data-layout=top] body { position: fixed; top: 0; left: 0; right: 0; height: 80px; }

  #urlform { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--field); }
  /* The field's own rounded ring shows focus; the browser's square outline on the inner input is turned off. */
  #urlform:focus-within { background: var(--active); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
  #urlform input:focus, #urlform input:focus-visible { outline: none; }
  #urlform svg { color: var(--muted); width: 14px; height: 14px; flex: none; }
  input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--text); font: inherit; outline: none; }
  input::placeholder { color: var(--muted); }

  /* History suggestions under the address bar. With tabs on top Rust makes this webview taller while it shows. */
  #urlform { position: relative; }
  #sugg { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; border-radius: 8px;
    background: var(--frame); box-shadow: inset 0 0 0 1px var(--hair); }
  [data-layout=top] #sugg { right: auto; width: max(100%, 360px); }
  #sugg li { display: flex; flex-direction: column; justify-content: center; min-height: 40px; padding: 4px 10px; border-radius: 6px; min-width: 0; }
  #sugg li:hover { background: var(--hover); }
  #sugg li[aria-selected=true] { background: var(--active); }
  #sugg b, #sugg span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #sugg b { font-weight: 500; }
  #sugg span { color: var(--muted); font-size: .92em; }
  .sugg-open, .sugg-open body { overflow: visible; }

  #essentials:empty { display: none; }
  .tile { display: grid; place-items: center; border-radius: 8px; }
  .tile:hover { background: var(--hover); }
  .tile.active { background: var(--active); }
  .tile img { width: 16px; height: 16px; }
  /* Dark-on-transparent favicons (GitHub) would vanish on the dark frame; a 1px halo keeps their edge. */
  [data-dark=true] img { filter: drop-shadow(0 0 .8px rgb(255 255 255 / .9)); }

  #new { display: flex; align-items: center; gap: 10px; color: var(--muted); border-radius: 8px; }
  #new:hover { color: var(--text); background: var(--hover); }
  #new svg { width: 14px; height: 14px; }

  #tabs { margin: 0; padding: 0; list-style: none; scrollbar-width: none; }
  .tab { position: relative; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 4px 0 10px; color: var(--muted); border-radius: 8px; min-width: 0;
    transition: background-color .15s ease-out, color .15s ease-out, box-shadow .15s ease-out; }
  .tab:hover { color: var(--text); background: var(--hover); }
  .tab.active { color: var(--text); background: var(--active); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .18), inset 0 0 0 1px var(--hair); }
  .tab:active { transform: scale(.985); }
  .tab.dragging { opacity: .6; transform: none; }
  .tab .mark[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .tab { transition: none; } }
  .tab img, .tab .blank { width: 16px; height: 16px; flex: none; }
  .tab .blank { background: radial-gradient(circle, var(--muted) 2.5px, transparent 3px); }
  .tab .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .mark { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .tab .x { width: 22px; height: 22px; display: none; place-items: center; border-radius: 6px; color: var(--muted); flex: none; }
  .tab .x svg { width: 12px; height: 12px; }
  .tab:hover .x, .tab.active .x { display: grid; }
  .tab .x:hover { color: var(--text); background: var(--hover); }

  #foot { display: flex; align-items: center; gap: 2px; }
  #foot .spacer { flex: 1; align-self: stretch; }
  /* Profile button: the profile's picture (or first letter) in a circle, like the other toolbar icons. */
  #prof i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--hair); color: var(--text); font: 600 10px/1 var(--font); font-style: normal; }
  #prof i img { width: 100%; height: 100%; object-fit: cover; }
  #prof:hover i { box-shadow: 0 0 0 1.5px var(--hair); }
  #grip { position: fixed; z-index: 1; }

  /* Sidebar layout */
  [data-layout=side] body { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: 32px auto auto auto 1fr auto;
    grid-template-areas: "nav drag win" "url url url" "ess ess ess" "new new new" "tabs tabs tabs" "foot foot foot"; padding: 8px 10px 10px; }
  [data-layout=side] #urlform { margin-top: 8px; }
  [data-layout=side] #essentials { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; }
  [data-layout=side] .tile { height: 40px; background: var(--field); }
  [data-layout=side] .tile:hover { background: var(--hover); }
  [data-layout=side] .tile.active { background: var(--active); }
  [data-layout=side] #new { height: 34px; padding-left: 12px; margin-top: 14px; }
  [data-layout=side] #tabs { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  [data-layout=side] #foot { margin-top: 8px; }
  [data-layout=side][data-side=right] body { grid-template-areas: "win drag nav" "url url url" "ess ess ess" "new new new" "tabs tabs tabs" "foot foot foot"; }
  [data-layout=side] #grip { top: 0; bottom: 0; left: 0; width: 5px; cursor: ew-resize; }
  [data-layout=side][data-side=right] #grip { left: auto; right: 0; }

  /* Top bar layout: tab row above a toolbar row (TOP_BAR = 80px in main.rs) */
  /* Flex rows, so "+" sits right after the last tab: tabs, +, drag space, window controls | break | nav, address, essentials, buttons. */
  [data-layout=top] body { display: flex; flex-wrap: wrap; align-content: start; padding: 0 8px; column-gap: 6px; }
  [data-layout=top] #tabs, [data-layout=top] #new, [data-layout=top] #drag, [data-layout=top] #win,
  [data-layout=top] #nav, [data-layout=top] #urlform, [data-layout=top] #essentials, [data-layout=top] #foot { height: 40px; }
  [data-layout=top] #tabs { order: 1; } [data-layout=top] #new { order: 2; } [data-layout=top] #drag { order: 3; } [data-layout=top] #win { order: 4; }
  [data-layout=top] #br { order: 5; flex-basis: 100%; height: 0; }
  [data-layout=top] #nav { order: 6; } [data-layout=top] #urlform { order: 7; } [data-layout=top] #essentials { order: 8; } [data-layout=top] #foot { order: 9; }
  [data-layout=top] #urlform { flex: 1; min-width: 160px; height: 30px; align-self: center; }
  /* Without "wide address bar" the field is a centred column with equal room on both sides. */
  [data-layout=top]:not([data-wide=true]) #urlform { max-width: 680px; margin-inline: auto; }
  [data-layout=top] #drag { flex: 1; }
  [data-layout=side] #br { display: none; }
  [data-layout=top] #tabs { display: flex; gap: 2px; align-items: end; overflow-x: auto; padding-top: 6px; min-width: 0; max-width: calc(100% - 180px); }
  /* Top bar tabs look like tabs: thin dividers between inactive ones, the active one a raised card. */
  [data-layout=top] .tab { flex: 0 1 200px; min-width: 96px; height: 32px; }
  [data-layout=top] .tab + .tab::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 1px; background: var(--hair); transition: opacity .15s; }
  [data-layout=top] .tab.active::before, [data-layout=top] .tab.active + .tab::before,
  [data-layout=top] .tab:hover::before, [data-layout=top] .tab:hover + .tab::before { opacity: 0; }
  [data-layout=top] #new { width: 28px; height: 28px; justify-content: center; align-self: end; margin-bottom: 2px; }
  [data-layout=top] #new .label { display: none; }
  [data-layout=top] #win { align-items: start; padding-top: 6px; }
  [data-layout=top] #essentials { display: flex; gap: 2px; align-items: center; }
  [data-layout=top] #foot { align-items: center; }
  [data-layout=top] .tile { width: 30px; height: 30px; }
  [data-layout=top] #foot .spacer { display: none; }
  [data-layout=top] #grip { left: 0; right: 0; top: 0; height: 4px; cursor: ns-resize; }

  #nav { grid-area: nav; } #drag { grid-area: drag; } #win { grid-area: win; } #urlform { grid-area: url; }
  #essentials { grid-area: ess; } #new { grid-area: new; } #tabs { grid-area: tabs; } #foot { grid-area: foot; }
</style>
</head>
<body>
  <div id="wall" aria-hidden="true"></div>
  <div id="topstrip">
    <button class="ib" title="Minimize" aria-label="Minimize" onclick="send('win:min')"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="ib" title="Maximize" aria-label="Maximize" onclick="send('win:max')"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>
    <button class="ib close" title="Close" aria-label="Close" onclick="send('win:close')"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <div id="grip" onmousedown="send('resize')"></div>
  <div id="nav" class="row">
    <button class="ib" title="Back (Alt+Left)" aria-label="Back" onclick="send('back')"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ib" title="Forward (Alt+Right)" aria-label="Forward" onclick="send('forward')"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="ib" title="Reload (F5)" aria-label="Reload" onclick="send('reload')"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  </div>
  <span id="drag"></span>
  <div id="win" class="row">
    <button class="ib" title="Minimize" aria-label="Minimize" onclick="send('win:min')"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="ib" title="Maximize" aria-label="Maximize" onclick="send('win:max')"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg></button>
    <button class="ib close" title="Close" aria-label="Close" onclick="send('win:close')"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <form id="urlform" onsubmit="event.preventDefault(); go()">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="url" aria-label="Address" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-controls="sugg">
    <ul id="sugg" aria-label="From your history" hidden></ul>
  </form>
  <div id="essentials" role="list" aria-label="Essentials"></div>
  <button id="new" title="New tab (Ctrl+T)" aria-label="New tab" onclick="send('key:new')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="label">New tab</span></button>
  <ul id="tabs" role="tablist" aria-label="Tabs"></ul>
  <span id="br" aria-hidden="true"></span>
  <div id="foot">
    <button class="ib" id="dl" title="Downloads (Ctrl+J)" aria-label="Downloads" onclick="send('downloads')"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg><i></i></button>
    <span class="spacer"></span>
    <button class="ib" title="Compact mode (Ctrl+Alt+C)" aria-label="Compact mode" onclick="send('key:compact')"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9.5 5v14"/></svg></button>
    <button class="ib" id="prof" onclick="send('profiles')"><i></i></button>
    <button class="ib" title="Settings (Ctrl+,)" aria-label="Settings" onclick="send('key:settings')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const url = $('url'), list = $('tabs'), grid = $('essentials');
  const send = m => window.ipc.postMessage(m);
  const go = () => { send('go:' + url.value); url.blur(); };
  const host = u => { try { return new URL(u).host; } catch { return ''; } };
  // Fetch from the site itself so no third party learns which sites are open.
  // shortcut: misses icons declared via <link rel=icon> elsewhere; upgrade by reading WebView2's FaviconChanged event.
  const favicon = u => { try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.origin + '/favicon.ico' : ''; } catch { return ''; } };
  const icon = u => {
    if (!favicon(u)) { const d = document.createElement('span'); d.className = 'blank'; return d; }
    const img = document.createElement('img'); img.alt = ''; img.src = favicon(u); img.onerror = () => img.style.visibility = 'hidden'; return img;
  };
  function focusUrl() { url.focus(); url.select(); }

  // Called by Rust: the strip above the page opened or closed. Leaving this webview closes it again.
  function topPeek(on) { document.documentElement.dataset.toppeek = on; }
  document.documentElement.addEventListener('mouseleave', () => { if (document.documentElement.dataset.toppeek === 'true') send('toppeek:0'); });

  // Called by Rust: running downloads, their overall % (-1 = size unknown), and whether one finished unseen.
  function downloadsBadge(running, pct, unseen) {
    const b = $('dl');
    b.dataset.busy = running > 0;
    b.dataset.known = pct >= 0;
    b.style.setProperty('--p', Math.max(pct, 0));
    b.dataset.unseen = unseen && !running;
    b.title = running ? `Downloading ${running === 1 ? '1 file' : running + ' files'}${pct >= 0 ? ' · ' + pct + ' %' : ''} (Ctrl+J)` : 'Downloads (Ctrl+J)';
  }
  // "https://www.github.com/x" shows as "github.com/x" unless "Always show full URLs" is on; editing shows it all.
  let curUrl = '';
  const shown = u => !u || (S && S.fullUrls) ? u : u.replace(/^https:\/\//, '').replace(/^www\./, '').replace(/^([^/?#]+)\/$/, '$1');

  // Window glass: show the new tab wallpaper behind the tab UI, aligned with the window.
  let wallSrc = '', frame = null, S = null;
  function wall(s) {
    S = s;
    const root = document.documentElement, on = s.bgWindow && !!s.bg;
    root.dataset.wall = on;
    root.dataset.full = on && !s.compact; // matches window_glass() in main.rs
    root.style.setProperty('--sw', s.sidebarWidth + 'px');
    root.style.setProperty('--wall-blur', s.frameBlur + 'px');
    root.style.setProperty('--wall-tint', s.frameTint / 100);
    // Behind blurred glass a still looks the same as a moving picture, so videos and web wallpapers use their
    // thumbnail here when there is one: one video decoder (or one live page) for the whole window, not two.
    const moving = s.bg === 'bg.web' || /\.(mp4|webm)$/.test(s.bg);
    const file = moving ? s.bgThumb || (s.bg === 'bg.web' ? '' : s.bg) : s.bg;
    const src = on && file ? `https://bg.velocity.example/${file}?v=${s.bgVer}` : '';
    if (src !== wallSrc) {
      wallSrc = src;
      const el = !src ? null : /\.(mp4|webm)$/.test(file)
        ? Object.assign(document.createElement('video'), { src, autoplay: true, loop: true, muted: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src, alt: '' });
      $('wall').replaceChildren(...(el ? [el] : []));
    }
    const v = $('wall').querySelector('video');
    if (v) v.playbackRate = s.bgSpeed / 100;
    if (frame) velocityFrame(frame);
  }
  // Called by Rust with the window size and where this webview sits in it (logical px).
  function velocityFrame(f) {
    frame = f;
    const z = (S ? S.uiScale : 100) / 100, w = $('wall').style;
    w.left = -f.uiX / z + 'px'; w.top = -f.uiY / z + 'px';
    w.width = f.w / z + 'px'; w.height = f.h / z + 'px';
  }
  // The wallpaper video only needs to play while the window is visible.
  document.addEventListener('visibilitychange', () => {
    const v = $('wall').querySelector('video');
    if (v && S && S.bgPause) document.hidden ? v.pause() : v.play().catch(() => {});
  });

  // Called from Rust with the whole state on every change.
  velocitySuggest(url, $('sugg'), go);
  $('sugg').addEventListener('change', () => {
    const open = !$('sugg').hidden;
    document.documentElement.classList.toggle('sugg-open', open);
    // Room the list needs below the bar (only used with tabs on top)
    send('sugg:' + (open ? Math.ceil($('sugg').offsetHeight + 12) : 0));
  });

  function render(tabs, active, essentials, s, profile) {
    const root = document.documentElement.dataset;
    window.velocityTheme(s);
    wall(s);
    root.layout = s.tabsTop ? 'top' : 'side';
    root.side = s.sidebarRight ? 'right' : 'left';
    root.wide = s.wideUrl;
    root.compact = s.compact;
    // Profile button: redrawn only when the profile's picture changes.
    const btn = $('prof'), key = profile.n + '|' + profile.a;
    if (btn.dataset.key !== key) {
      btn.dataset.key = key;
      btn.title = btn.ariaLabel = 'Profile: ' + profile.n;
      const pic = btn.firstChild;
      if (profile.a) {
        const img = document.createElement('img');
        img.alt = '';
        img.src = 'https://avatars.velocity.example/' + profile.a.split('?').map((x, i) => i ? x : encodeURIComponent(x)).join('?');
        pic.replaceChildren(img);
      } else pic.textContent = profile.n[0].toUpperCase();
    }
    const cur = tabs.find(t => t.id === active);
    // Rebuild the Essentials only when the list itself changed; otherwise just move the highlight.
    const essKey = essentials.join('\n');
    if (grid.dataset.key !== essKey) {
      grid.dataset.key = essKey;
      grid.replaceChildren(...essentials.map((e, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.host = host(e);
        tile.role = 'listitem';
        tile.tabIndex = 0;
        tile.title = host(e) + '\nRight-click to unpin';
        tile.onclick = () => send('essential:' + i);
        tile.onkeydown = ev => { if (ev.key === 'Enter') send('essential:' + i); };
        tile.oncontextmenu = ev => { ev.preventDefault(); send('unpin:' + e); };
        tile.append(icon(e));
        return tile;
      }));
    }
    for (const tile of grid.children) tile.classList.toggle('active', !!cur && host(cur.url) === tile.dataset.host);

    /* Tabs are updated in place, keyed by id: switching tabs only moves the highlight, so favicons don't
       reload and blink, hover stays put and the active background can fade instead of jumping. */
    const old = new Map([...list.children].map(li => [li.dataset.id, li]));
    const next = tabs.map(t => {
      const li = old.get(String(t.id)) || makeTab(t.id);
      updateTab(li, t, t.id === active);
      return li;
    });
    const moved = next.length !== list.children.length || next.some((li, i) => list.children[i] !== li);
    if (moved && !drag?.moved) list.replaceChildren(...next); // not while a tab is being dragged
    if (active !== lastActive) {
      lastActive = active;
      list.querySelector('.tab.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    }
    curUrl = cur ? cur.url : '';
    if (document.activeElement !== url) url.value = shown(curUrl);
  }
  let lastActive = null;

  function makeTab(id) {
    const li = document.createElement('li');
    li.className = 'tab';
    li.dataset.id = id;
    li.role = 'tab';
    li.tabIndex = 0;
    const span = document.createElement('span');
    span.className = 'name';
    const mark = document.createElement('i');
    mark.className = 'mark';
    mark.title = 'Loaded in the background';
    const x = document.createElement('button');
    x.className = 'x';
    x.ariaLabel = 'Close tab';
    x.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
    x.onclick = e => { e.stopPropagation(); send('close:' + id); };
    li.onclick = () => { if (li.dataset.dragged) delete li.dataset.dragged; else send('select:' + id); };
    li.onkeydown = e => { if (e.key === 'Enter') send('select:' + id); };
    li.onauxclick = e => { if (e.button === 1) send('close:' + id); };
    li.oncontextmenu = e => { e.preventDefault(); if (li.dataset.url) send('pin:' + id); };
    li.append(icon(''), span, mark, x);
    return li;
  }

  function updateTab(li, t, isActive) {
    li.classList.toggle('active', isActive);
    li.ariaSelected = isActive;
    li.dataset.url = t.url;
    li.title = t.title + (t.url ? '\n' + t.url + '\nRight-click to pin to Essentials' : '');
    li.querySelector('.name').textContent = t.title || t.url;
    li.querySelector('.mark').hidden = !t.unseen;
    const site = favicon(t.url);
    if (li.dataset.icon !== site) { // only when the site changes, not on every update
      li.dataset.icon = site;
      li.firstChild.replaceWith(icon(t.url));
    }
  }

  // Compact mode: Rust reveals the tab UI at the window edge; leaving it hides it again unless typing.
  document.body.addEventListener('mouseleave', () => { if (document.activeElement !== url) send('unpeek'); });
  url.addEventListener('blur', () => { if (!document.body.matches(':hover')) send('unpeek'); });

  // Any empty spot of the tab bar moves the window (in the sidebar that is most of it, not just the strip
  // next to the window buttons); double-clicking one maximises.
  // Drag a tab to another place in the list (after 5 px, so a click stays a click); Rust gets the new position.
  let drag = null;
  list.addEventListener('pointerdown', e => {
    const li = e.target.closest('.tab');
    if (!li || e.button !== 0 || e.target.closest('.x')) return;
    delete li.dataset.dragged;
    drag = { li, x: e.clientX, y: e.clientY, moved: false };
  });
  addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
      drag.moved = true;
      drag.li.classList.add('dragging');
    }
    const across = document.documentElement.dataset.layout === 'top';
    const before = [...list.children].find(li => {
      if (li === drag.li) return false;
      const r = li.getBoundingClientRect();
      return across ? e.clientX < r.left + r.width / 2 : e.clientY < r.top + r.height / 2;
    });
    if (before !== drag.li.nextElementSibling) list.insertBefore(drag.li, before || null);
  });
  addEventListener('pointerup', () => {
    if (!drag) return;
    if (drag.moved) {
      drag.li.classList.remove('dragging');
      drag.li.dataset.dragged = 1; // the click that follows isn't a "select"
      send(`move:${drag.li.dataset.id}:${[...list.children].indexOf(drag.li)}`);
    }
    drag = null;
  });

  const blank = t => t === document.body || t === document.documentElement || ['drag', 'tabs', 'foot', 'nav', 'win', 'essentials', 'br', 'topstrip'].includes(t.id) || t.classList.contains('spacer');
  addEventListener('mousedown', e => { if (e.button === 0 && e.detail === 1 && blank(e.target)) send('drag'); });
  addEventListener('dblclick', e => { if (blank(e.target)) send('win:max'); });
  url.addEventListener('focus', () => { if (url.value === shown(curUrl)) url.value = curUrl; url.select(); });
  url.addEventListener('blur', () => { if (url.value === curUrl) url.value = shown(curUrl); });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    const k = !e.ctrlKey ? null : e.altKey ? ({c: 'compact'})[e.key]
      : ({t: 'new', w: 'close', l: 'focus', ',': 'settings', Tab: e.shiftKey ? 'prev' : 'next'})[e.key];
    if (k) { e.preventDefault(); send('key:' + k); return; }
    if (e.key === 'F5') { e.preventDefault(); send('reload'); }
    if (e.key === 'F12') { e.preventDefault(); send('devtools'); }
    if (e.ctrlKey && !e.altKey && e.key === 'j') { e.preventDefault(); send('downloads'); }
    if (e.altKey && e.key === 'ArrowLeft') send('back');
    if (e.altKey && e.key === 'ArrowRight') send('forward');
    if (e.key === 'Escape') url.blur();
  });
</script>
</body>
</html>
