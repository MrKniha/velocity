<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Velocity">
  <!-- A dot in motion: the point and the trail it leaves. Monochrome; src/icon.rs draws the same shapes. -->
  <rect width="64" height="64" rx="14" fill="#141416"/>
  <rect x="10" y="29" width="26" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
  <rect x="18" y="20" width="14" height="4" rx="2" fill="#fff" fill-opacity=".2"/>
  <circle cx="42" cy="32" r="10" fill="#fff"/>
</svg>
